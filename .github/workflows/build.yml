name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test core package
        run: swift test --package-path Packages/EyeballsCore

      - name: Check plugin files
        run: |
          for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json \
                   plugin/hooks/hooks.json plugin/monitors/monitors.json; do
            jq -e . "$f" > /dev/null
          done
          jq -e 'all(.[]; (keys - ["name","command","description","when"]) == [])' plugin/monitors/monitors.json
          test -x plugin/bin/eyeballs
          sh -n plugin/bin/eyeballs
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$(jq -r .version plugin/.claude-plugin/plugin.json)" = "${GITHUB_REF_NAME#v}"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "build_settings=MARKETING_VERSION=$version" >> "$GITHUB_OUTPUT"
          else
            version="$(grep -E '^\s*MARKETING_VERSION:' project.yml | sed -E 's/.*"(.*)".*/\1/')-${GITHUB_SHA::7}"
            echo "build_settings=" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      # Ad hoc signed: Apple Silicon won't run unsigned code, and there is no Developer ID here.
      - name: Build
        run: |
          xcodebuild \
            -project Eyeballs.xcodeproj \
            -scheme Eyeballs \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${{ steps.version.outputs.build_settings }} \
            build

      - name: Test app
        run: |
          xcodebuild test \
            -project Eyeballs.xcodeproj \
            -scheme Eyeballs \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=

      - name: Check the app
        run: |
          app=build/Build/Products/Release/Eyeballs.app
          cli="$app/Contents/Helpers/eyeballs"
          lipo -archs "$app/Contents/MacOS/Eyeballs"
          lipo -archs "$cli"
          codesign --verify --strict --verbose=2 "$cli"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv "$cli" 2>&1 | grep -q 'Identifier=coops.eyeballs.cli'
          codesign -dv "$cli" 2>&1 | grep -Eq 'flags=.*adhoc.*runtime'
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleShortVersionString|CFBundleVersion'
          "$cli" --version
          "$cli" --version | grep -qF "eyeballs $(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist") ($(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist"))"
          EYEBALLS_HOME="$RUNNER_TEMP/eyeballs-home" "$cli" doctor --json > /dev/null

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/Eyeballs.app \
            "Eyeballs-${{ steps.version.outputs.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Eyeballs-${{ steps.version.outputs.name }}
          path: Eyeballs-${{ steps.version.outputs.name }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Eyeballs-${{ steps.version.outputs.name }}.zip" \
            --title "Eyeballs ${{ steps.version.outputs.name }}" \
            --generate-notes
